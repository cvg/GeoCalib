name: ONNX export

# Export the ONNX model on CPU and check it against the PyTorch implementation:
# dense perspective fields, confidences, and calibrated camera and gravity
# parameters.

on:
  push:
    branches: [main]
    paths:
      - "geocalib/**"
      - "onnx/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/onnx_export.yml"
  pull_request:
    paths:
      - "geocalib/**"
      - "onnx/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/onnx_export.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch; the export and its check depend on these versions.
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy opencv-python-headless kornia matplotlib \
            onnx==1.23.2 onnxruntime==1.23.2
          python -m pip install --no-deps -e .

      - name: Cache the weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/geocalib
          key: geocalib-weights-v1.0

      - name: Export the ONNX model
        run: python onnx/export.py --weights distorted --output_dir /tmp/geocalib_onnx

      - name: Check the ONNX model
        run: |
          python onnx/check.py --cpu \
            --weights distorted \
            --model /tmp/geocalib_onnx/geocalib_distorted.onnx
